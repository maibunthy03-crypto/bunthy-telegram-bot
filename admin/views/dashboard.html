<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maline Admin Dashboard</title><link rel="stylesheet" href="/admin-assets/admin.css"></head><body><aside><div class="side-brand"><b>M</b><span>Maline V4</span></div><nav><button data-tab="overview" class="active">▦ Overview</button><button data-tab="rooms">⌂ Apartments</button><button data-tab="enquiries">✉ Enquiries</button><button data-tab="bookings">▣ Bookings</button><button data-tab="groups">🌐 Groups</button></nav><form method="post" action="/admin/logout"><button class="logout">Sign out</button></form></aside><main><header><div><small>ADMINISTRATION</small><h1 id="pageTitle">Overview</h1></div><button id="refresh">Refresh</button></header><section id="overview" class="tab active"><div id="stats" class="stats"></div><div class="grid"><div class="panel"><h2>Recent enquiries</h2><div id="recentEnquiries"></div></div><div class="panel"><h2>Recent bookings</h2><div id="recentBookings"></div></div></div></section><section id="rooms" class="tab"><div class="toolbar"><h2>Apartment inventory</h2><button id="newRoom">+ Add apartment</button></div><div class="panel table-wrap"><table><thead><tr><th>Apartment</th><th>Size</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody id="roomsTable"></tbody></table></div></section><section id="enquiries" class="tab"><div class="panel table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Subject</th><th>Message</th><th>Status</th></tr></thead><tbody id="enquiriesTable"></tbody></table></div></section><section id="bookings" class="tab"><div class="panel table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Room</th><th>Move in</th><th>Status</th></tr></thead><tbody id="bookingsTable"></tbody></table></div></section><section id="groups" class="tab"><div id="groupsList" class="cards"></div></section></main><dialog id="roomDialog"><form id="roomForm"><input type="hidden" name="id"><div class="dialog-head"><h2>Apartment details</h2><button type="button" id="closeDialog">×</button></div><div class="form-grid"><label>Title<input name="title" required></label><label>Unit number<input name="unitNumber"></label><label>Bedrooms<input name="bedrooms" type="number" min="0"></label><label>Bathrooms<input name="bathrooms" type="number" min="0"></label><label>Size (sqm)<input name="sizeSqm" type="number" min="0"></label><label>Floor<input name="floor"></label><label>Monthly price<input name="monthlyPrice" type="number" min="0"></label><label>Currency<input name="currency" value="USD"></label></div><label>Description<textarea name="description"></textarea></label><label>Photo URLs — one per line<textarea name="photos"></textarea></label><label>Facilities — one per line<textarea name="facilities"></textarea></label><label>Services included — one per line<textarea name="servicesIncluded"></textarea></label><label>Services excluded — one per line<textarea name="servicesExcluded"></textarea></label><label>Nearby places — one per line<textarea name="nearbyPlaces"></textarea></label><div class="checks"><label><input name="available" type="checkbox" checked> Available</label><label><input name="featured" type="checkbox"> Featured</label></div><button class="primary">Save apartment</button></form></dialog><script src="/admin-assets/admin.js"></script></body></html>
